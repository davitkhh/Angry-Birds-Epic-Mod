<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Combatant Forge</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <strong class="brand">Combatant Forge</strong>
  <div class="tabs" id="modeTabs" role="tablist" aria-label="Section">
    <button data-mode="combatant" class="on" role="tab">Combatants</button>
    <button data-mode="projectile" role="tab">Projectiles</button>
  </div>
  <div class="menu" id="fileMenu">
    <button id="fileBtn" aria-haspopup="true" aria-expanded="false" aria-controls="filePanel">File ▾</button>
    <div class="menuPanel" id="filePanel" role="menu" hidden>
      <label><span id="projectSelectLabel">Combatant</span> <select id="projectSelect"></select></label>
      <button id="newBtn" role="menuitem">New</button>
      <button id="existingBtn" role="menuitem" title="Show the game's own combatants in the left panel; press again for the sprites">View existing</button>
      <button id="importBtn" role="menuitem" title="Open a .forge file">Import</button>
      <button id="exportBtn" role="menuitem" title="Save this combatant and its art as a .forge file">Export</button>
      <button id="duplicateBtn" role="menuitem" title="Make a new combatant that starts as a copy of this game combatant" hidden>Duplicate</button>
      <button id="variantBtn" role="menuitem" title="Add a variant of this game combatant (like its bird3 or boss)" hidden>Add variant…</button>
      <button id="deleteBtn" role="menuitem" class="danger">Delete…</button>
    </div>
  </div>
  <input id="importInput" type="file" accept=".forge,application/zip" hidden>
  <input id="projImportInput" type="file" accept=".forgeprojectile,application/json" hidden>
  <label class="grow">Name <input id="nameInput" placeholder="Shown in battle" maxlength="40"></label>
  <label>Id <input id="idInput" class="mono" placeholder="id" maxlength="40"></label>
  <span id="saveState" class="dim"></span>
  <span id="jobChips"></span>
  <span id="unityState" class="pill"></span>
  <button id="uploadBtn" class="primary">Upload to game</button>
</header>

<main>
  <section id="library" class="panel">
    <div class="tabs" id="sideTabs">
      <button data-side="pig" class="on">Pigs</button>
      <button data-side="bird">Birds</button>
    </div>
    <div class="chips" id="catChips"></div>
    <div class="row">
      <input id="searchInput" class="grow" type="search" placeholder="Search sprites">
      <select id="rigFilter" title="Only sprites from this character"></select>
    </div>
    <div class="row between">
      <label class="check" title="Show Front and Back as separate sprites you can drag on their own"><input type="checkbox" id="splitAll"> Separate front and back</label>
      <span id="libCount" class="dim"></span>
    </div>
    <div id="grid"></div>
    <div id="dropZone" tabindex="0" role="button">
      <strong>Add art to the game</strong>
      <span>Drop PNGs here or click. Name a back layer <code>x_Back.png</code>.</span>
      <div class="row">
        <select id="uploadSide"><option value="pig">Pigs</option><option value="bird">Birds</option></select>
        <select id="uploadCat"><option>Headgear</option><option>MainHand</option><option>OffHand</option><option value="Feature">Feature</option></select>
      </div>
      <input id="fileInput" type="file" accept="image/png" multiple hidden>
    </div>
  </section>

  <div class="resizer" id="resizeLeft" role="separator" aria-orientation="vertical" aria-label="Resize the library"></div>
  <section id="stageWrap">
    <div class="toolbar">
      <button id="baseBtn" class="combatOnly" title="Choose the base character"><img id="baseIcon" alt=""><span id="baseName"></span></button>
      <span class="sep combatOnly"></span>
      <label class="combatOnly">Animation <select id="clipSelect"></select></label>
      <button id="playBtn" class="combatOnly" title="Play or pause (Space)">Pause</button>
      <input id="scrub" class="combatOnly" type="range" min="0" max="1000" value="0" aria-label="Animation position">
      <span id="frameLabel" class="mono dim combatOnly"></span>
      <span class="projOnly row" id="projTools">
        <button id="fireBtn" class="primary" title="Fire the projectile from the launcher at the targets (Physics tab)">Fire</button>
        <label class="check"><input type="checkbox" id="fireLoop" checked> Keep firing</label>
        <span class="dim" id="projHint">Drag the launcher and the targets to aim</span>
      </span>
    </div>
    <div class="toolbar sub">
      <label>Speed <select id="speedSelect"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
      <label class="check"><input type="checkbox" id="loopCheck" checked> Loop</label>
      <label class="check combatOnly"><input type="checkbox" id="showGear" checked> Show equipment</label>
      <label class="check combatOnly"><input type="checkbox" id="showFeatures" checked> Show swapped features</label>
      <label class="check combatOnly"><input type="checkbox" id="showSlots"> Slot labels</label>
      <span id="targetControls" class="row" hidden>
        <span class="sep"></span>
        <span class="dim">Targets</span>
        <button id="targetLess" class="iconBtn" aria-label="One target fewer">−</button>
        <span id="targetCount" class="mono"></span>
        <button id="targetMore" class="iconBtn" aria-label="One more target">+</button>
      </span>
      <label class="check" title="Draw the path of every projectile (the attack you last played, or every fired component here)"><input type="checkbox" id="showPaths"> Projectile paths</label>
      <label class="check combatOnly" title="Draw where the attack you last played walks to (melee attacks walk up to their target and back)"><input type="checkbox" id="showWalks"> Walk paths</label>
      <span class="grow"></span>
      <button id="fitBtn">Fit</button>
    </div>
    <div id="canvasBox"><canvas id="stage"></canvas><div id="emptyHint"></div></div>
  </section>

  <div class="resizer" id="resizeRight" role="separator" aria-orientation="vertical" aria-label="Resize the slots and abilities panel"></div>
  <section id="side" class="panel">
    <div id="variantNav" class="row combatOnly" hidden>
      <button id="variantPrev" class="iconBtn" aria-label="Previous variant">◀</button>
      <span id="variantLabel" class="grow"></span>
      <button id="variantNext" class="iconBtn" aria-label="Next variant">▶</button>
    </div>
    <div class="tabs" id="sideNav">
      <button data-tab="slots" class="on">Slots</button>
      <button data-tab="abilities" class="combatOnly">Abilities</button>
      <button data-tab="stats" class="combatOnly">Stats</button>
      <button data-tab="pphysics" class="projOnly">Physics</button>
    </div>
    <div class="tab" id="tab-slots">
      <div id="projComponents" class="projOnly"></div>
      <div id="inspector"></div>
      <div id="slotList"></div>
    </div>
    <div class="tab" id="tab-abilities" hidden>
      <div class="row between">
        <h3>Tap-and-hold preview</h3>
        <span class="dim" id="levelStats"></span>
      </div>
      <div id="tooltipOuter"><div id="tooltip"></div></div>
      <div class="row between abilityHead">
        <h3>Abilities</h3>
        <div class="row">
          <button id="generateAll" title="Run Claude on every ability that has a description and isn't written yet">Generate all</button>
          <button id="addExisting">Add from game</button>
          <button id="addNew">New ability</button>
        </div>
      </div>
      <div id="abilityList"></div>
      <div id="decisionOrder"></div>
    </div>
    <div class="tab" id="tab-pphysics" hidden>
      <div id="physicsForm"></div>
    </div>
    <div class="tab" id="tab-stats" hidden>
      <div id="statsForm"></div>
    </div>
  </section>
</main>

<div id="dragGhost" hidden></div>
<div id="toast" role="status"></div>
<dialog id="modal"></dialog>
<dialog id="logDialog">
  <div class="row between"><h3 id="logTitle">Uploading</h3><div class="row"><button id="logStop" class="danger" hidden>Stop generating</button><button id="logClose">Minimize</button></div></div>
  <pre id="logBody"></pre>
</dialog>
<script src="app.js"></script>
<script src="projectiles.js"></script>
<script src="decisions.js"></script>
</body>
</html>
