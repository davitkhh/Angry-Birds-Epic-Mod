<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double Difference</title>
<style>
  :root { --bg: #f5f5f4; --card: #fff; --text: #1c1917; --muted: #78716c; --accent: #2563eb; --border: #d6d3d1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --card: #292524; --text: #f5f5f4; --muted: #a8a29e; --accent: #60a5fa; --border: #44403c; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px system-ui, sans-serif; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: min(320px, calc(100vw - 32px)); box-sizing: border-box; }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  .formula { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); margin-bottom: 14px; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .result { border-top: 1px solid var(--border); padding-top: 14px; }
  .value { font-size: 2rem; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
  .steps { color: var(--muted); font-size: 0.85rem; min-height: 1.2em; }
</style>
</head>
<body>
<div class="card">
  <h1>Double Difference</h1>
  <p class="formula">a + 2 × (a − b)</p>
  <label for="a">First number (a)</label>
  <input id="a" type="number" step="any" placeholder="e.g. 10" autofocus>
  <label for="b">Second number (b)</label>
  <input id="b" type="number" step="any" placeholder="e.g. 4">
  <div class="result">
    <div class="value" id="value">—</div>
    <div class="steps" id="steps"></div>
  </div>
</div>
<script>
  const a = document.getElementById('a');
  const b = document.getElementById('b');
  const value = document.getElementById('value');
  const steps = document.getElementById('steps');
  const fmt = n => String(Math.round(n * 1e10) / 1e10);

  function update() {
    if (a.value === '' || b.value === '') { value.textContent = '—'; steps.textContent = ''; return; }
    const x = parseFloat(a.value), y = parseFloat(b.value);
    const diff = x - y;
    value.textContent = fmt(x + 2 * diff);
    steps.textContent = `${fmt(x)} + 2 × ${fmt(diff)}`;
  }
  a.addEventListener('input', update);
  b.addEventListener('input', update);
</script>
</body>
</html>
